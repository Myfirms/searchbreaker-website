<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="../styles.css"></helmet>
<section data-tone="{{ tone }}" aria-labelledby="{{ headingId }}" style="background:var(--section-bg);color:var(--color-text);font-family:var(--font-sans);padding:var(--section-pad-y) var(--gutter)">
<div style="max-width:var(--container-max);margin:0 auto;display:flex;flex-direction:column;gap:var(--space-10)">
<header style="display:flex;flex-direction:column;gap:var(--space-4);max-width:720px">
<sc-if value="{{ hasEyebrow }}" hint-placeholder-val="{{ false }}"><span style="font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-mono-caps);text-transform:uppercase;color:var(--color-text-muted)">{{ eyebrow }}</span></sc-if>
<h2 id="{{ headingId }}" style="margin:0;font-size:var(--text-h2);line-height:var(--leading-heading);letter-spacing:var(--tracking-heading);font-weight:var(--font-weight-semibold);text-wrap:balance">{{ heading }}</h2>
<sc-if value="{{ hasLead }}" hint-placeholder-val="{{ true }}"><p style="margin:0;max-width:var(--measure-lead);font-size:var(--text-lg);line-height:var(--leading-body);color:var(--color-text-secondary);text-wrap:pretty">{{ lead }}</p></sc-if>
</header>
<ul data-columns="{{ columns }}" style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(var(--grid-col-min),1fr));gap:var(--space-4)">
<sc-for list="{{ itemList }}" as="it" hint-placeholder-count="3"><li style="display:flex;flex-direction:column;gap:var(--space-3);box-sizing:border-box;padding:var(--card-pad);background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--card-radius)">
<sc-if value="{{ it.hasTop }}" hint-placeholder-val="{{ true }}"><div style="display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);min-height:40px">
<sc-if value="{{ it.hasIcon }}" hint-placeholder-val="{{ true }}"><span style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);background:var(--color-accent-subtle);color:var(--color-accent)"><dc-import name="Icon" icon="{{ it.icon }}" size="20" hint-size="20px,20px"></dc-import></span></sc-if>
<sc-if value="{{ it.hasAvailability }}" hint-placeholder-val="{{ false }}"><dc-import name="AvailabilityBadge" state="{{ it.availability }}" hint-size="80px,22px"></dc-import></sc-if>
</div></sc-if>
<h3 style="margin:0;font-size:var(--text-xl);line-height:var(--leading-snug);letter-spacing:var(--tracking-heading);font-weight:var(--font-weight-semibold)">{{ it.title }}</h3>
<p style="margin:0;font-size:var(--text-md);line-height:var(--leading-body);color:var(--color-text-secondary);text-wrap:pretty">{{ it.text }}</p>
<sc-if value="{{ it.hasHref }}" hint-placeholder-val="{{ false }}"><a href="{{ it.href }}" style="margin-top:auto;display:inline-flex;align-items:center;gap:6px;min-height:var(--touch-target);font-size:var(--text-sm);font-weight:var(--font-weight-medium);color:var(--color-link);text-underline-offset:var(--link-underline-offset)" style-hover="color:var(--color-link-hover);text-decoration-thickness:2px">{{ it.linkLabel }}<dc-import name="Icon" icon="arrow-right" size="16" hint-size="16px,16px"></dc-import></a></sc-if>
</li></sc-for></ul>
</div></section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;480px&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;muted&quot;,&quot;accent&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;SectionTone&quot;},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Start from verified experience&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;columns&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;2&quot;,&quot;3&quot;,&quot;4&quot;],&quot;default&quot;:&quot;2&quot;,&quot;tsType&quot;:&quot;2 | 3 | 4&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;FeatureItem[]&quot;}}">
class Component extends DCLogic {
  uid = 'sbfg' + Math.random().toString(36).slice(2, 7);
  renderVals() {
    const p = this.props;
    const items = p.items || [
      { title: 'Candidate facts', text: 'Every role, result and skill you confirm is stored once and reused. Tailoring can reword a fact but never add one.', icon: 'user-check' },
      { title: 'Role-specific resume base', text: 'Keep a base resume per target role, so each tailored version starts close to the job.', icon: 'file' }
    ];
    return {
      headingId: this.uid,
      tone: p.tone || 'default',
      eyebrow: p.eyebrow, hasEyebrow: !!p.eyebrow,
      heading: p.heading || 'Start from verified experience',
      lead: p.lead, hasLead: !!p.lead,
      columns: String(p.columns || (items.length === 2 || items.length === 4 ? 2 : 3)),
      itemList: items.map(it => ({ ...it, hasIcon: !!it.icon, hasAvailability: !!it.availability, hasTop: !!(it.icon || it.availability), hasHref: !!it.href, linkLabel: it.linkLabel || 'See how it works' }))
    };
  }
}
</script>
</body>
</html>
