<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="../styles.css"></helmet>
<section data-tone="{{ tone }}" aria-labelledby="{{ headingId }}" style="background:var(--section-bg);color:var(--color-text);font-family:var(--font-sans);padding:var(--section-pad-y) var(--gutter)">
<div style="max-width:var(--container-max);margin:0 auto;display:flex;flex-direction:column;gap:var(--space-10)">
<header style="display:flex;flex-direction:column;gap:var(--space-4);max-width:720px">
<h2 id="{{ headingId }}" style="margin:0;font-size:var(--text-h2);line-height:var(--leading-heading);letter-spacing:var(--tracking-heading);font-weight:var(--font-weight-semibold);text-wrap:balance">{{ heading }}</h2>
<sc-if value="{{ hasLead }}" hint-placeholder-val="{{ false }}"><p style="margin:0;max-width:var(--measure-lead);font-size:var(--text-lg);line-height:var(--leading-body);color:var(--color-text-secondary);text-wrap:pretty">{{ lead }}</p></sc-if>
</header>
<ul style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:var(--space-4)">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="3"><li style="display:flex;flex-direction:column;gap:var(--space-3);box-sizing:border-box;padding:var(--card-pad);background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--card-radius)">
<h3 style="margin:0;font-size:var(--text-xl);line-height:var(--leading-snug);letter-spacing:var(--tracking-heading);font-weight:var(--font-weight-semibold)">{{ it.title }}</h3>
<p style="margin:0;font-size:var(--text-md);line-height:var(--leading-body);color:var(--color-text-secondary);text-wrap:pretty">{{ it.text }}</p>
<sc-if value="{{ it.hasCaveat }}" hint-placeholder-val="{{ true }}"><div style="margin-top:auto;display:flex;flex-direction:column;gap:var(--space-1);padding-top:var(--space-3);border-top:1px solid var(--color-border)"><span style="font-family:var(--font-mono);font-size:var(--text-2xs);letter-spacing:var(--tracking-mono-caps);text-transform:uppercase;color:var(--color-text-muted)">{{ caveatLabel }}</span><span style="font-size:var(--text-sm);line-height:var(--leading-snug);color:var(--color-text-secondary)">{{ it.caveat }}</span></div></sc-if>
</li></sc-for></ul>
</div></section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;420px&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;muted&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;SectionTone&quot;},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Who this helps&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;AudienceItem[]&quot;}}">
class Component extends DCLogic {
  uid = 'sbac' + Math.random().toString(36).slice(2, 7);
  renderVals() {
    const p = this.props;
    const items = p.items || [
      { title: 'Experienced professionals', text: 'You have years of results to draw on and need each application to show the ones that matter for that job.', caveat: 'Less useful if you apply to one or two roles a month.' },
      { title: 'Career changers', text: 'You need to show how past work maps to a new field, using only what you actually did.', caveat: 'It will not invent experience in the new field.' },
      { title: 'High-volume searchers', text: 'You apply often and need to keep versions, dates and follow-ups straight.', caveat: 'It will not send applications without your approval.' }
    ];
    return {
      headingId: this.uid,
      tone: p.tone || 'default',
      heading: p.heading || 'Who this helps',
      lead: p.lead, hasLead: !!p.lead,
      caveatLabel: p.caveatLabel || 'Keep in mind',
      items: items.map(i => ({ ...i, hasCaveat: !!i.caveat }))
    };
  }
}
</script>
</body>
</html>
