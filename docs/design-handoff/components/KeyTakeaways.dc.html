<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="../styles.css"></helmet>
<section data-tone="{{ tone }}" aria-labelledby="{{ headingId }}" style="container-type:inline-size;container-name:article;background:var(--section-bg);color:var(--color-text);font-family:var(--font-sans);padding:var(--space-6) var(--gutter)">
<div style="max-width:var(--container-max);margin:0 auto">
<div data-article-col="true" style="box-sizing:border-box;display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-6);border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-surface-raised)">
<h2 id="{{ headingId }}" style="margin:0;font-size:var(--text-xl);line-height:var(--leading-snug);font-weight:var(--font-weight-semibold)">{{ heading }}</h2>
<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-3)">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="4"><li style="display:flex;gap:var(--space-3);font-size:var(--text-md);line-height:var(--leading-body)"><span style="display:flex;flex:none;color:var(--color-accent);padding-top:3px"><dc-import name="Icon" icon="check" size="20" hint-size="20px,20px"></dc-import></span>{{ it }}</li></sc-for>
</ul></div></div></section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;320px&quot;},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Key takeaways&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;}}">
class Component extends DCLogic {
  uid = 'sbkt' + Math.random().toString(36).slice(2, 7);
  renderVals() {
    const p = this.props;
    return {
      headingId: this.uid, tone: p.tone || 'default',
      heading: p.heading || 'Key takeaways',
      items: p.items || ['Tailoring changes wording and order, not facts.', 'Map each requirement to real evidence before you edit.', 'Use the job’s terms only where they describe your actual work.', 'Check every line before you send.']
    };
  }
}
</script>
</body>
</html>
