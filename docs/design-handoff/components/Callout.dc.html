<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="../styles.css"></helmet>
<aside data-callout="{{ variant }}" aria-label="{{ kindLabel }}" style="box-sizing:border-box;display:flex;gap:var(--space-3);padding:var(--space-4) var(--space-5);border-radius:var(--radius-sm);background:var(--co-bg);font-family:var(--font-sans);color:var(--color-text)">
<span style="display:flex;flex:none;color:var(--co-fg);padding-top:2px"><dc-import name="Icon" icon="{{ icon }}" size="20" hint-size="20px,20px"></dc-import></span>
<div style="display:flex;flex-direction:column;gap:var(--space-1)">
<span style="font-family:var(--font-mono);font-size:var(--text-2xs);letter-spacing:var(--tracking-mono-caps);text-transform:uppercase;font-weight:var(--font-weight-medium);color:var(--co-fg)">{{ kindLabel }}</span>
<sc-if value="{{ hasTitle }}" hint-placeholder-val="{{ true }}"><strong style="font-size:var(--text-md);line-height:var(--leading-snug);font-weight:var(--font-weight-semibold)">{{ title }}</strong></sc-if>
<p style="margin:0;font-size:var(--text-md);line-height:var(--leading-body);color:var(--color-text-secondary);text-wrap:pretty">{{ text }}</p>
</div></aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;640px&quot;,&quot;height&quot;:&quot;140px&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tip&quot;,&quot;warning&quot;,&quot;note&quot;],&quot;default&quot;:&quot;tip&quot;,&quot;tsType&quot;:&quot;'tip' | 'warning' | 'note'&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  static V = { tip: ['Tip', 'check-circle'], warning: ['Warning', 'alert'], note: ['Note', 'info'] };
  renderVals() {
    const p = this.props;
    const v = Component.V[p.variant] ? p.variant : 'note';
    return {
      variant: v, kindLabel: Component.V[v][0], icon: Component.V[v][1],
      title: p.title, hasTitle: !!p.title,
      text: p.text || 'Keep one master list of facts. Tailoring then becomes selecting and rewording, not remembering.'
    };
  }
}
</script>
</body>
</html>
