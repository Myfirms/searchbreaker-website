<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="../styles.css"></helmet>
<div role="region" aria-label="{{ regionLabel }}" style="position:{{ position }};left:0;right:0;bottom:0;z-index:30;box-sizing:border-box;background:var(--color-surface-raised);border-top:1px solid var(--color-border);box-shadow:var(--shadow-md);padding:var(--space-3) var(--gutter) calc(var(--space-3) + env(safe-area-inset-bottom));font-family:var(--font-sans);color:var(--color-text)">
<sc-if value="{{ hasText }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:var(--space-3)"><span style="flex:1 1 auto;font-size:var(--text-xs);line-height:var(--leading-snug);color:var(--color-text-secondary)">{{ text }}</span><div style="flex:none"><dc-import name="Button" readiness="{{ readiness }}" label="{{ label }}" href="{{ href }}" size="md" on-activate="{{ onActivate }}" hint-size="150px,44px"></dc-import></div></div></sc-if>
<sc-if value="{{ noText }}" hint-placeholder-val="{{ true }}"><dc-import name="Button" readiness="{{ readiness }}" label="{{ label }}" href="{{ href }}" size="md" full-width="{{ true }}" on-activate="{{ onActivate }}" hint-size="100%,44px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;390px&quot;,&quot;height&quot;:&quot;120px&quot;},&quot;readiness&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;waitlist&quot;,&quot;live&quot;],&quot;default&quot;:&quot;waitlist&quot;,&quot;tsType&quot;:&quot;Readiness&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;position&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;fixed&quot;,&quot;static&quot;],&quot;default&quot;:&quot;fixed&quot;,&quot;tsType&quot;:&quot;'fixed' | 'static'&quot;},&quot;onActivate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      position: p.position || 'fixed',
      readiness: p.readiness || 'waitlist',
      label: p.label, href: p.href,
      text: p.text, hasText: !!p.text, noText: !p.text,
      regionLabel: p.readiness === 'live' ? 'Get started' : 'Join the waitlist',
      onActivate: p.onActivate
    };
  }
}
</script>
</body>
</html>
