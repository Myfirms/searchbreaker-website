<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="../styles.css"></helmet>
<span data-availability="{{ state }}" data-badge-variant="{{ variant }}" style="display:inline-flex;align-items:center;gap:6px;box-sizing:border-box;height:var(--badge-height);padding:0 var(--badge-pad-x);border-radius:var(--badge-radius);border:1px var(--av-border-style) var(--av-border);background:var(--av-bg);color:var(--av-fg);font-family:var(--badge-font);font-size:var(--badge-text);letter-spacing:var(--badge-tracking);text-transform:uppercase;font-weight:var(--font-weight-medium);line-height:1;white-space:nowrap"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Availability: </span><sc-if value="{{ isLive }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="4" fill="currentColor"></circle></svg></sc-if><sc-if value="{{ isPreview }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M7 2.75a4.25 4.25 0 0 1 0 8.5z" fill="currentColor"></path></svg></sc-if><sc-if value="{{ isConcept }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2.5L11.5 7 7 11.5 2.5 7z" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg></sc-if><sc-if value="{{ isPlanned }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"></circle></svg></sc-if><sc-if value="{{ isIllustrative }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.75" y="2.75" width="8.5" height="8.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 1.5"></rect></svg></sc-if>{{ text }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;280px&quot;,&quot;height&quot;:&quot;48px&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;preview&quot;,&quot;concept&quot;,&quot;planned&quot;,&quot;illustrative&quot;],&quot;default&quot;:&quot;preview&quot;,&quot;tsType&quot;:&quot;Availability | 'illustrative'&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;filled&quot;,&quot;outline&quot;],&quot;default&quot;:&quot;filled&quot;,&quot;tsType&quot;:&quot;'filled' | 'outline'&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;detail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  static L = { live: 'Live', preview: 'Preview', concept: 'Concept', planned: 'Planned', illustrative: 'Illustrative data' };
  renderVals() {
    const p = this.props;
    const st = Component.L[p.state] ? p.state : 'concept';
    const label = p.label || Component.L[st];
    return {
      state: st,
      variant: p.variant || 'filled',
      text: p.detail ? label + ' · ' + p.detail : label,
      isLive: st === 'live', isPreview: st === 'preview', isConcept: st === 'concept',
      isPlanned: st === 'planned', isIllustrative: st === 'illustrative'
    };
  }
}
</script>
</body>
</html>
