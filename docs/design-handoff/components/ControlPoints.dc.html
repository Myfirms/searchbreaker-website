<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="../styles.css"></helmet>
<section data-tone="{{ tone }}" aria-labelledby="{{ headingId }}" style="background:var(--section-bg);color:var(--color-text);font-family:var(--font-sans);padding:var(--section-pad-y) var(--gutter)">
<div style="max-width:var(--container-max);margin:0 auto;display:flex;flex-wrap:wrap;gap:var(--space-10) var(--space-16)">
<header style="flex:1 1 300px;display:flex;flex-direction:column;gap:var(--space-4);align-self:flex-start">
<sc-if value="{{ hasEyebrow }}" hint-placeholder-val="{{ false }}"><span style="font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-mono-caps);text-transform:uppercase;color:var(--color-text-muted)">{{ eyebrow }}</span></sc-if>
<h2 id="{{ headingId }}" style="margin:0;font-size:var(--text-h2);line-height:var(--leading-heading);letter-spacing:var(--tracking-heading);font-weight:var(--font-weight-semibold);text-wrap:balance">{{ heading }}</h2>
<sc-if value="{{ hasLead }}" hint-placeholder-val="{{ true }}"><p style="margin:0;font-size:var(--text-lg);line-height:var(--leading-body);color:var(--color-text-secondary);text-wrap:pretty">{{ lead }}</p></sc-if>
</header>
<ul style="flex:1.6 1 460px;list-style:none;margin:0;padding:0;display:flex;flex-direction:column">
<sc-for list="{{ pointList }}" as="pt" hint-placeholder-count="4"><li style="display:grid;grid-template-columns:40px minmax(0,1fr);gap:var(--space-4);padding:var(--space-5) 0;border-top:1px solid var(--color-border)">
<span style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);background:var(--color-accent-subtle);color:var(--color-accent)"><dc-import name="Icon" icon="{{ pt.icon }}" size="20" hint-size="20px,20px"></dc-import></span>
<div style="display:flex;flex-direction:column;gap:var(--space-1)"><h3 style="margin:0;font-size:var(--text-lg);line-height:var(--leading-snug);font-weight:var(--font-weight-semibold)">{{ pt.title }}</h3><p style="margin:0;font-size:var(--text-md);line-height:var(--leading-body);color:var(--color-text-secondary);text-wrap:pretty">{{ pt.text }}</p></div>
</li></sc-for></ul>
</div></section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;560px&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;muted&quot;,&quot;accent&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;SectionTone&quot;},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;What you control&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;points&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ControlPoint[]&quot;}}">
class Component extends DCLogic {
  uid = 'sbcp' + Math.random().toString(36).slice(2, 7);
  renderVals() {
    const p = this.props;
    const pts = p.points || [
      { title: 'Edit your experience', text: 'Your profile is the only source for resumes and applications. Change or remove any fact at any time.', icon: 'edit' },
      { title: 'Approve every material', text: 'Each tailored resume and answer waits for your review. Accept, edit or reject each proposed change.', icon: 'user-check' },
      { title: 'Decide when to submit', text: 'Nothing is sent to an employer without an explicit action from you.', icon: 'send' },
      { title: 'Pause or skip at any point', text: 'Skip a job, pause a search or stop a workflow without losing your data.', icon: 'pause' }
    ];
    return {
      headingId: this.uid,
      tone: p.tone || 'default',
      eyebrow: p.eyebrow, hasEyebrow: !!p.eyebrow,
      heading: p.heading || 'What you control',
      lead: p.lead, hasLead: !!p.lead,
      pointList: pts.map(x => ({ ...x, icon: x.icon || 'check' }))
    };
  }
}
</script>
</body>
</html>
