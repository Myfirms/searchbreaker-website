<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="../styles.css"></helmet>
<footer data-tone="{{ tone }}" style="background:var(--section-bg);color:var(--color-text);font-family:var(--font-sans);border-top:1px solid var(--color-border);padding:var(--space-16) var(--gutter) var(--space-8)">
<div style="max-width:var(--container-max);margin:0 auto;display:flex;flex-direction:column;gap:var(--space-12)">
<div style="display:flex;flex-wrap:wrap;gap:var(--space-10) var(--space-12)">
<div style="flex:1 1 260px;max-width:360px;display:flex;flex-direction:column;gap:var(--space-4)">
<a href="/" aria-label="SearchBreaker home" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--color-text);font-size:19px;font-weight:var(--font-weight-semibold);letter-spacing:-0.03em"><img src="../assets/logo/mark.svg" width="26" height="26" alt="">SearchBreaker</a>
<p style="margin:0;font-size:var(--text-sm);line-height:var(--leading-body);color:var(--color-text-secondary);text-wrap:pretty">{{ statusNote }}</p>
</div>
<nav aria-label="Footer" style="flex:2 1 520px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-8)">
<sc-for list="{{ columns }}" as="col" hint-placeholder-count="3"><div style="display:flex;flex-direction:column;gap:var(--space-2)">
<h2 style="margin:0;font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--tracking-mono-caps);text-transform:uppercase;font-weight:var(--font-weight-medium);color:var(--color-text-muted)">{{ col.title }}</h2>
<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column">
<sc-for list="{{ col.links }}" as="link" hint-placeholder-count="4"><li><a href="{{ link.href }}" style="display:inline-flex;align-items:center;min-height:var(--touch-target);font-size:var(--text-sm);color:var(--color-text);text-decoration:none" style-hover="text-decoration:underline;text-underline-offset:3px">{{ link.label }}</a></li></sc-for>
</ul></div></sc-for>
</nav>
</div>
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--space-2) var(--space-6);padding-top:var(--space-4);border-top:1px solid var(--color-border);font-size:var(--text-xs);color:var(--color-text-muted)">
<span>{{ copyright }}</span>
<ul style="list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0 var(--space-5)">
<sc-for list="{{ legalLinks }}" as="link" hint-placeholder-count="3"><li><a href="{{ link.href }}" style="display:inline-flex;align-items:center;min-height:var(--touch-target);color:var(--color-text-secondary);text-decoration:none" style-hover="text-decoration:underline">{{ link.label }}</a></li></sc-for>
</ul></div>
</div></footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;420px&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;muted&quot;],&quot;default&quot;:&quot;muted&quot;,&quot;tsType&quot;:&quot;'default' | 'muted'&quot;},&quot;columns&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;FooterColumn[]&quot;},&quot;legalLinks&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;LinkItem[]&quot;},&quot;statusNote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  static COLS = [
    { title: 'Product', links: [{ label: 'How it works', href: '/how-it-works' }, { label: 'Job Finder', href: '/features/ai-job-finder' }, { label: 'Job Matching', href: '/features/job-matcher' }, { label: 'Resume Tailoring', href: '/features/resume-tailoring' }, { label: 'Auto Apply', href: '/features/auto-apply' }, { label: 'Application Tracker', href: '/features/job-application-tracker' }] },
    { title: 'Resources', links: [{ label: 'Guides', href: '/guides' }, { label: 'Tailor a resume to a job description', href: '/guides/tailor-resume-to-job-description' }] },
    { title: 'Company', links: [{ label: 'About', href: '/about' }, { label: 'Contact', href: '/contact' }] }
  ];
  static LEGAL = [{ label: 'Privacy policy', href: '/privacy' }, { label: 'Terms', href: '/terms' }, { label: 'Cookie settings', href: '#cookies' }];
  renderVals() {
    const p = this.props;
    return {
      tone: p.tone || 'muted',
      columns: p.columns || Component.COLS,
      legalLinks: p.legalLinks || Component.LEGAL,
      statusNote: p.statusNote || 'SearchBreaker is in private testing. Features marked Preview, Concept or Planned are not generally available yet.',
      copyright: p.copyright || '© 2026 SearchBreaker'
    };
  }
}
</script>
</body>
</html>
